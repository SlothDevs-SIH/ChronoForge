# Engine + Agent. The web app runs with `npm run dev` for now (its dev proxy points at localhost:8001/8002).
services:
  engine:
    build:
      context: .
      dockerfile: engine/Dockerfile
    ports: ["8001:8001"]
    env_file: [.env]
  agent:
    build:
      context: .
      dockerfile: agent/Dockerfile
    ports: ["8002:8002"]
    env_file: [.env]
    environment:
      ENGINE_URL: http://engine:8001
    depends_on: [engine]
