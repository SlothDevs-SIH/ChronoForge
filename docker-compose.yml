# Engine + Agent. The web app is a static build (web/): deploy it to Vercel or any static host and point /api/engine and
# /api/agent at these two services (see web/vercel.json and README "Deploying").
services:
  engine:
    build:
      context: .
      dockerfile: engine/Dockerfile
    ports: ["8001:8001"]
    env_file: [.env]
    volumes:
      - ./data:/data            # the ticket warehouse (data/warehouse) and satellite cache; website requests are saved here too
  agent:
    build:
      context: .
      dockerfile: agent/Dockerfile
    ports: ["8002:8002"]
    env_file: [.env]
    environment:
      ENGINE_URL: http://engine:8001
      AGENT_USE_STUBS: "0"      # real Engine, real checks
      TELEGRAM_POLLING: "1"     # no public URL needed for the bot
    volumes:
      - agent-data:/data        # accounts, cases, approvals, citizen photos: keep this volume or all of it is lost
    depends_on: [engine]
volumes:
  agent-data:
